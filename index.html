<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#365233">
  <title>Learning Hub</title>

  <style>
    :root {
      --green: #365233;
      --green-dark: #294027;
      --green-light: #eaf0e8;
      --text: #263128;
      --muted: #6d756e;
      --border: #dfe5df;
      --bg: #f6f8f5;
      --white: #ffffff;
      --yellow: #fff2cc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      background: var(--green);
      color: white;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 245px;
      max-width: 42vw;
      height: 58px;
      object-fit: contain;
      object-position: left center;
      display: block;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .subtitle {
      opacity: .85;
      font-size: 13px;
      margin-top: 5px;
    }

    .refresh {
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.12);
      color: white;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .refresh:hover {
      background: rgba(255,255,255,.2);
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 26px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .metric {
      background: var(--green);
      color: white;
      border-radius: 14px;
      padding: 20px;
      min-height: 115px;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .metric-label {
      font-size: 12px;
      letter-spacing: .7px;
      font-weight: 700;
      opacity: .9;
    }

    .metric-value {
      font-size: 34px;
      font-weight: 800;
      margin-top: 18px;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow: 0 2px 7px rgba(0,0,0,.04);
    }

    .panel-head {
      padding: 17px 20px;
      background: var(--green);
      color: white;
      font-weight: 700;
      font-size: 16px;
    }

    .panel-body {
      padding: 18px;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .course-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 17px;
      background: #fff;
    }

    .course-name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .course-collection {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px;
    }

    .course-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }

    .mini {
      background: var(--green-light);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .mini strong {
      display: block;
      font-size: 17px;
    }

    .mini span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .progress-track {
      height: 8px;
      background: #e6ebe6;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 10px;
    }

    .course-rate {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    input, select {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 12px;
      font: inherit;
      background: white;
      min-width: 180px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      text-align: left;
      background: var(--green-light);
      color: var(--green-dark);
      padding: 11px 10px;
      font-size: 12px;
      position: sticky;
      top: 0;
    }

    td {
      padding: 11px 10px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }

    tr:hover td {
      background: #fafcf9;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .status.completed {
      background: var(--green-light);
      color: var(--green-dark);
    }

    .status.progress {
      background: var(--yellow);
      color: #765f00;
    }

    .status.not-started {
      background: #ececec;
      color: #666;
    }

    .pct {
      font-weight: 700;
      white-space: nowrap;
    }

    .footer {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px 15px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }

      .topbar {
        padding: 16px;
      }

      .wrap {
        padding: 16px;
      }

      .logo {
        width: 190px;
        max-width: 55vw;
        height: 48px;
      }

      .title {
        font-size: 19px;
      }
    }

    @media (max-width: 520px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .metric {
        min-height: 95px;
      }

      .metric-value {
        margin-top: 10px;
      }

      .topbar {
        align-items: flex-start;
      }
    }
  
    /* Responsive / mobile layout */
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin-inline: auto;
    }

    img {
      max-width: 100%;
    }

    .header-inner {
      width: 100%;
      min-width: 0;
      flex-wrap: wrap;
    }

    .dashboard-grid,
    .stats-grid,
    .course-grid {
      min-width: 0;
    }

    .stat-card,
    .course-card,
    .panel {
      min-width: 0;
      overflow: hidden;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 680px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filters > * {
      min-width: 0;
    }

    @media (max-width: 900px) {
      .container {
        width: min(100% - 24px, 760px);
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .course-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .container {
        width: calc(100% - 16px);
      }

      /* Larger, easier-to-read typography in portrait mode */
      body {
        font-size: 16px;
      }

      .title {
        font-size: 19px;
      }

      .subtitle {
        font-size: 14px;
      }

      .panel-title {
        font-size: 18px;
      }

      .stat-label {
        font-size: 13px;
      }

      .stat-value {
        font-size: 32px;
      }

      .course-name {
        font-size: 17px;
      }

      .metric {
        font-size: 15px;
      }

      .filters input,
      .filters select,
      .filters button {
        font-size: 16px;
        min-height: 46px;
      }

      .header {
        padding: 14px 0;
      }

      .header-inner {
        gap: 10px;
      }

      .logo {
        width: min(190px, 58vw);
        height: 42px;
      }

      .title {
        width: 100%;
        font-size: 17px;
        line-height: 1.25;
      }

      .subtitle {
        width: 100%;
        font-size: 12px;
        line-height: 1.45;
      }

      .stats-grid,
      .course-grid {
        grid-template-columns: 1fr;
      }

      .stat-card {
        padding: 16px;
      }

      .stat-value {
        font-size: 28px;
      }

      .panel {
        padding: 14px;
        border-radius: 12px;
      }

      .panel-title {
        font-size: 16px;
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr;
        width: 100%;
      }

      .filters input,
      .filters select,
      .filters button {
        width: 100%;
        min-height: 42px;
      }

      .course-card {
        padding: 14px;
      }

      .course-name {
        font-size: 15px;
      }

      .metric {
        font-size: 13px;
      }

      .table-wrap {
        margin-inline: -14px;
        width: calc(100% + 28px);
      }

      table {
        min-width: 650px;
        font-size: 14px;
      }

      th,
      td {
        padding: 11px 9px;
      }

      .footer {
        text-align: center;
        padding: 18px 10px;
      }
    }

    @media (max-width: 380px) {
      .container {
        width: calc(100% - 16px);
      }

      .logo {
        width: 170px;
        height: 38px;
      }

      .title {
        font-size: 16px;
      }

      .stat-value {
        font-size: 25px;
      }

      .panel {
        padding: 12px;
      }
    }

    /* Mobile header: logo on top, app name below */
    @media (max-width: 700px) {
      .topbar {
        align-items: flex-start;
      }

      .brand {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .logo {
        width: 200px;
        max-width: 60vw;
        height: 44px;
      }

      .title {
        font-size: 22px;
      }

      .subtitle {
        margin-top: 4px;
      }
    }

  </style>
</head>

      catch (e) { return ""; }
    }

    function setKey(k) {
      try {
        if (k) localStorage.setItem("mcgKey", k);
        else localStorage.removeItem("mcgKey");
      } catch (e) {}
    }

    function showLoadError(msg) {
      const el = document.getElementById("loading");
      el.style.display = "block";
      document.getElementById("app").style.display = "none";
      el.innerHTML = msg +
        ' <a href="#" onclick="loadData();return false;">Try again</a>';
    }

    function loadData() {

      document.getElementById("loading").style.display = "block";
      document.getElementById("loading").textContent = "Loading...";
      document.getElementById("app").style.display = "none";

      const key = getKey();

      const url = API_URL +
        (API_URL.indexOf("?") >= 0 ? "&" : "?") +
        "action=dashboard" +
        (key ? "&key=" + encodeURIComponent(key) : "");

      fetch(url, { redirect: "follow" })
        .then(function(r) { return r.text(); })
        .then(function(text) {

          let data;

          try {
            data = JSON.parse(text);
          } catch (err) {
            throw new Error(
              "The server did not return dashboard data. " +
              "Requested: " + url.replace(/key=[^&]*/, "key=***") +
              " | Received: " +
              String(text).replace(/\s+/g, " ").slice(0, 150)
            );
          }

          if (data && data.error === "unauthorized") {
            setKey("");
            const k = window.prompt("Enter the dashboard access key:");
            if (k) {
              setKey(k.trim());
              loadData();
            } else {
              showLoadError("An access key is required.");
            }
            return;
          }

          if (data && data.error) {
            throw new Error(data.error);
          }

          dashboardData = data || dashboardData;

          document.getElementById("loading").style.display = "none";
          document.getElementById("app").style.display = "block";

          renderAll();

        })
        .catch(function(error) {
          showLoadError(
            "Unable to load the dashboard. " +
            (error && error.message ? error.message : "Please try again.")
          );
        });

    }

    function renderAll() {

      const m =
        dashboardData.metrics || {};

      document.getElementById("mLearners").textContent =
        m.learners || 0;

      document.getElementById("mCourses").textContent =
        m.courses || 0;

      document.getElementById("mProgress").textContent =
        m.inProgress || 0;

      document.getElementById("mCompleted").textContent =
        m.completed || 0;

      document.getElementById("mRate").textContent =
        Math.round((m.completionRate || 0) * 100) + "%";

      populateCommunityFilter();
      populateCourseFilter();
      renderCourses();
      renderLearners();
      renderMetrics();

      if (dashboardData.generatedAt) {

        const d =
          new Date(dashboardData.generatedAt);

        document.getElementById("updated").textContent =
          "Last refreshed: " +
          d.toLocaleString();

      }

    }

    function getFilteredRecords() {

      const community =
        document.getElementById("communityFilter")
          ? document.getElementById("communityFilter").value
          : "";

      return (dashboardData.records || [])
        .filter(function(r) {
          return !community ||
            String(r.community || "Unassigned") === community;
        });
    }

    function renderMetrics() {

      const rows = getFilteredRecords();
      const learnerIds = {};
      const courses = {};
      let inProgress = 0;
      let completed = 0;

      rows.forEach(function(r) {
        learnerIds[r.learnerId] = true;
        const effectiveStatus = getEffectiveStatus(r);
        if (effectiveStatus === "Completed") completed++;
        if (effectiveStatus === "In Progress") inProgress++;
        courses[r.course] = true;
      });

      const learners = Object.keys(learnerIds).length;
      const total = completed + inProgress;
      const rate = total ? completed / total : 0;

      document.getElementById("mLearners").textContent = learners;
      document.getElementById("mCourses").textContent =
        Object.keys(courses).length;
      document.getElementById("mProgress").textContent = inProgress;
      document.getElementById("mCompleted").textContent = completed;
      document.getElementById("mRate").textContent =
        Math.round(rate * 100) + "%";
    }

    function populateCommunityFilter() {

      const select =
        document.getElementById("communityFilter");

      if (!select) return;

      const current = select.value;
      const communities = {};

      (dashboardData.records || []).forEach(function(r) {
        const community =
          String(r.community || "Unassigned").trim() || "Unassigned";
        communities[community] = true;
      });

      const names = Object.keys(communities)
        .sort(function(a, b) { return a.localeCompare(b); });

      select.innerHTML =
        '<option value="">All Communities</option>' +
        names.map(function(name) {
          return '<option value="' + escapeAttr(name) + '">' +
            escapeHtml(name) + '</option>';
        }).join("");

      if (names.indexOf(current) >= 0) {
        select.value = current;
      }
    }

    function renderCourses() {

      const grid =
        document.getElementById("courseGrid");

      const rows = getFilteredRecords();
      const courseMap = {};

      rows.forEach(function(r) {
        const key = r.course || "Unknown Course";
        if (!courseMap[key]) {
          courseMap[key] = {
            course: key,
            collection: r.collection || "",
            learners: {},
            inProgress: 0,
            completed: 0,
            progressTotal: 0,
            progressCount: 0
          };
        }
        const c = courseMap[key];
        c.learners[r.learnerId] = true;
        const effectiveStatus = getEffectiveStatus(r);
        if (effectiveStatus === "In Progress") c.inProgress++;
        if (effectiveStatus === "Completed") c.completed++;
        if (r.progress !== null && r.progress !== undefined && !isNaN(r.progress)) {
          c.progressTotal += Number(r.progress);
          c.progressCount++;
        }
      });

      const courses = Object.keys(courseMap).map(function(k) {
        const c = courseMap[k];
        const total = c.inProgress + c.completed;
        return {
          course: c.course,
          collection: c.collection,
          learners: Object.keys(c.learners).length,
          inProgress: c.inProgress,
          completed: c.completed,
          completionRate: total ? c.completed / total : 0,
          averageProgress: c.progressCount ? c.progressTotal / c.progressCount : 0
        };
      });

      if (!courses.length) {
        grid.innerHTML = '<div class="empty">No course data available for this community.</div>';
        return;
      }

      grid.innerHTML = courses.map(function(c) {
        const rate = Math.round((c.completionRate || 0) * 100);
        const avg = Math.round(c.averageProgress || 0);
        return `
          <div class="course-card">
            <div class="course-name">${escapeHtml(c.course)}</div>
            <div class="course-collection">${escapeHtml(c.collection || "")}</div>
            <div class="course-stats">
              <div class="mini"><strong>${c.learners}</strong><span>Learners</span></div>
              <div class="mini"><strong>${c.inProgress}</strong><span>In Progress</span></div>
              <div class="mini"><strong>${c.completed}</strong><span>Completed</span></div>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${Math.min(100, Math.max(0, avg))}%"></div>
            </div>
            <div class="course-rate">
              <span>Average progress ${avg}%</span>
              <strong>${rate}% completed</strong>
            </div>
          </div>`;
      }).join("");
    }

    function renderCourses_OLD_DISABLED() {

      const grid =
        document.getElementById("courseGrid");

      const courseNames = {};
      getFilteredRecords().forEach(function(r) {
        courseNames[r.course] = true;
      });
      const courses = Object.keys(courseNames).sort().map(function(course) {
        return { course: course };
      });

      if (!courses.length) {

        grid.innerHTML =
          '<div class="empty">No course data available.</div>';

        return;

      }

      grid.innerHTML =
        courses.map(function(c) {

          const rate =
            Math.round(
              (c.completionRate || 0) * 100
            );

          const avg =
            Math.round(
              c.averageProgress || 0
            );

          return `
            <div class="course-card">

              <div class="course-name">
                ${escapeHtml(c.course)}
              </div>

              <div class="course-collection">
                ${escapeHtml(c.collection || "")}
              </div>

              <div class="course-stats">

                <div class="mini">
                  <strong>${c.learners}</strong>
                  <span>Learners</span>
                </div>

                <div class="mini">
                  <strong>${c.inProgress}</strong>
                  <span>In Progress</span>
                </div>

                <div class="mini">
                  <strong>${c.completed}</strong>
                  <span>Completed</span>
                </div>

              </div>

              <div class="progress-track">
                <div
                  class="progress-fill"
                  style="width:${Math.min(100, Math.max(0, avg))}%"
                ></div>
              </div>

              <div class="course-rate">
                <span>Average progress ${avg}%</span>
                <strong>${rate}% completed</strong>
              </div>

            </div>
          `;

        }).join("");

    }

    function populateCourseFilter() {

      const select =
        document.getElementById("courseFilter");

      const current =
        select.value;

      const courses =
        dashboardData.courses || [];

      select.innerHTML =
        '<option value="">All Courses</option>' +
        courses.map(function(c) {
          return `
            <option value="${escapeAttr(c.course)}">
              ${escapeHtml(c.course)}
            </option>
          `;
        }).join("");

      if (
        courses.some(function(c) {
          return c.course === current;
        })
      ) {
        select.value = current;
      }

    }

    function renderLearners() {

      const tbody =
        document.getElementById("learnerTable");

      const empty =
        document.getElementById("empty");

      const search =
        document.getElementById("search")
          .value
          .trim()
          .toLowerCase();

      const course =
        document.getElementById("courseFilter")
          .value;

      const status =
        document.getElementById("statusFilter")
          .value;

      const community =
        document.getElementById("communityFilter")
          ? document.getElementById("communityFilter").value
          : "";

      let rows =
        (dashboardData.records || [])
          .filter(function(r) {

            const matchesSearch =
              !search ||
              String(r.learnerName || "")
                .toLowerCase()
                .includes(search);

            const matchesCommunity =
              !community ||
              String(r.community || "Unassigned") === community;

            const matchesCourse =
              !course ||
              r.course === course;

            const matchesStatus =
              !status ||
              getEffectiveStatus(r) === status;

            return (
              matchesSearch &&
              matchesCommunity &&
              matchesCourse &&
              matchesStatus
            );

          });

      if (!rows.length) {

        tbody.innerHTML = "";
        empty.style.display = "block";
        return;

      }

      empty.style.display = "none";

      tbody.innerHTML =
        rows.map(function(r) {

          const progress =
            r.progress === null || isNaN(r.progress)
              ? ""
              : Math.round(r.progress) + "%";

          const effectiveStatus =
            getEffectiveStatus(r);

          const statusClass =
            effectiveStatus === "Completed"
              ? "completed"
              : effectiveStatus === "Not Started"
                ? "not-started"
                : "progress";

          return `
            <tr>

              <td>
                <strong>
                  ${escapeHtml(r.learnerName)}
                </strong>
              </td>

              <td>
                ${escapeHtml(r.course)}
              </td>

              <td class="pct">
                ${progress}
              </td>

              <td>
                <span class="status ${statusClass}">
                  ${escapeHtml(effectiveStatus)}
                </span>
              </td>

              <td>
                ${formatDate(r.started)}
              </td>

              <td>
                ${formatDate(r.lastActivity)}
              </td>

            </tr>
          `;

        }).join("");

    }

    function formatDate(value) {

      if (!value) {
        return "—";
      }

      const d =
        new Date(value);

      if (isNaN(d.getTime())) {
        return "—";
      }

      return d.toLocaleString(
        undefined,
        {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    /*
     * A record only counts as "In Progress" once we
     * actually have a progress percentage for it. If
     * progress is unknown (null/NaN) and it isn't
     * Completed, treat it as "Not Started" instead of
     * "In Progress".
     */
    function getEffectiveStatus(r) {

      if (r.status === "Completed") {
        return "Completed";
      }

      if (
        r.progress === null ||
        r.progress === undefined ||
        isNaN(r.progress)
      ) {
        return "Not Started";
      }

      return r.status || "In Progress";

    }

    window.addEventListener(
      "load",
      loadData
    );

  </script>

</body>
